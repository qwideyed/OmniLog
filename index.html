<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniLog — Universal Media Tracker</title>
  <style>
    :root {
      --bg: #0b0d10;
      --surface: rgba(22, 27, 34, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --tag-movie: #ec4899;
      --tag-show: #8b5cf6;
      --tag-anime: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Add Form */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 1rem;
    }

    input, select, button {
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.65rem 1rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    button.btn-primary {
      background: var(--accent);
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 0.65rem 1.25rem;
      transition: opacity 0.2s;
    }

    button.btn-primary:hover {
      opacity: 0.9;
    }

    /* Controls & Filters */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Media Grid */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .badge-movie { background: rgba(236, 72, 153, 0.15); color: var(--tag-movie); }
    .badge-show { background: rgba(139, 92, 246, 0.15); color: var(--tag-show); }
    .badge-anime { background: rgba(6, 182, 212, 0.15); color: var(--tag-anime); }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .status-select {
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.2rem 0.5rem;
    }

    .btn-delete:hover {
      color: #ef4444;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <div class="logo-icon">Ω</div>
        <div>
          <h1>OmniLog</h1>
          <div class="subtitle">Universal Tracker · Movies · Shows · Anime</div>
        </div>
      </div>
      <div>
        <button class="filter-btn" id="exportBtn">Export JSON</button>
      </div>
    </header>

    <!-- Quick Add Bar -->
    <div class="form-card">
      <input type="text" id="titleInput" placeholder="Title (e.g. Dune, One Piece, Severance)..." />
      <select id="typeInput">
        <option value="anime">Anime</option>
        <option value="movie">Movie</option>
        <option value="show">TV Show</option>
      </select>
      <select id="statusInput">
        <option value="Watching">Watching</option>
        <option value="Plan to Watch">Plan to Watch</option>
        <option value="Completed">Completed</option>
        <option value="Dropped">Dropped</option>
      </select>
      <button class="btn-primary" id="addBtn">Add to Log</button>
    </div>

    <!-- Filter & View Bar -->
    <div class="controls">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="anime">Anime</button>
        <button class="filter-btn" data-filter="movie">Movies</button>
        <button class="filter-btn" data-filter="show">TV Shows</button>
      </div>
      <div style="font-size: 0.85rem; color: var(--text-muted);" id="counter">0 items logged</div>
    </div>

    <!-- Media Cards -->
    <div class="media-grid" id="mediaGrid"></div>
  </div>

  <script>
    const STORAGE_KEY = 'omnilog_data';
    let mediaList = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentFilter = 'all';

    const mediaGrid = document.getElementById('mediaGrid');
    const counter = document.getElementById('counter');
    const titleInput = document.getElementById('titleInput');
    const typeInput = document.getElementById('typeInput');
    const statusInput = document.getElementById('statusInput');
    const addBtn = document.getElementById('addBtn');
    const exportBtn = document.getElementById('exportBtn');
    const filterBtns = document.querySelectorAll('.filter-btn[data-filter]');

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(mediaList));
      render();
    }

    function addEntry() {
      const title = titleInput.value.trim();
      if (!title) return;

      const newEntry = {
        id: Date.now().toString(),
        title: title,
        type: typeInput.value,
        status: statusInput.value,
        dateAdded: new Date().toISOString()
      };
